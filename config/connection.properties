# Connection properties — PLACEHOLDERS ONLY.
# Fill with real values at deploy time.
# The original DataStage password was {dsmenc}-encrypted;
# a fresh Postgres credential must be supplied here — it is
# never recovered from the source.

jdbc.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
jdbc.user=${POSTGRES_USER}
jdbc.password=${POSTGRES_PASSWORD}

# Source file directory and error output directory
source.dir=${SRC_DIR}
error.dir=${ERR_DIR}
