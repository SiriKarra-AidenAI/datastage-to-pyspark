# Azure DevOps Pipeline — DataStage to PySpark
# Requires: Docker Registry service connection + Azure Resource Manager service connection

trigger: none  # manual or schedule-driven

variables:
  imageName: datastage-pyspark-cust-sales-scd-agg
  acrRegistry: $(ACR_REGISTRY)    # from pipeline variable / library group
  imageTag: $(Build.BuildId)

stages:
  # ============================================================
  # STAGE 1: Build and push to ACR
  # ============================================================
  - stage: Build
    displayName: Build and Push
    jobs:
      - job: BuildJob
        displayName: Docker build + push
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Docker@2
            displayName: Build image
            inputs:
              containerRegistry: $(DOCKER_REGISTRY_SERVICE_CONNECTION)
              repository: $(imageName)
              command: build
              Dockerfile: Dockerfile
              tags: $(imageTag)

          - task: Docker@2
            displayName: Push to ACR
            inputs:
              containerRegistry: $(DOCKER_REGISTRY_SERVICE_CONNECTION)
              repository: $(imageName)
              command: push
              tags: $(imageTag)

  # ============================================================
  # STAGE 2: Deploy to Azure Container Apps
  # ============================================================
  - stage: Deploy
    displayName: Deploy to Azure
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployJob
        displayName: Deploy Container App Job
        pool:
          vmImage: ubuntu-latest
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: Update Container Apps Job
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az containerapp job update \
                        --name $(CONTAINER_APP_JOB) \
                        --resource-group $(RESOURCE_GROUP) \
                        --image $(acrRegistry).azurecr.io/$(imageName):$(imageTag) \
                        --set-env-vars \
                          POSTGRES_HOST=$(POSTGRES_HOST) \
                          POSTGRES_PORT=5432 \
                          POSTGRES_DB=$(POSTGRES_DB) \
                          POSTGRES_USER=$(POSTGRES_USER) \
                          POSTGRES_PASSWORD=secretref:$(POSTGRES_PASSWORD_KEYVAULT_REF) \
                          SRC_DIR=/app/data \
                          ERR_DIR=/app/data \
                          RUN_DATE=$(RUN_DATE)
